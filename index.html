<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Squadro - ¡Victoria Clara!</title>
  <style>
    :root {
      --size: min(92vmin, 780px);
      --slot: calc(var(--size) / 8);
      --trough: calc(var(--slot) * 1.4);
      --gap: 3px;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      gap: 1rem;
    }
    #board {
      display: grid;
      grid-template-columns: var(--trough) repeat(5, var(--slot)) var(--trough);
      grid-template-rows: var(--trough) repeat(5, var(--slot)) var(--trough);
      gap: var(--gap);
      background: #111;
      padding: var(--gap);
      border: 4px solid #ffd700;
      width: var(--size);
      height: var(--size);
    }
    .slot, .trough {
      background: #000;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .trough { 
      border: 3px solid #ffd700; 
      background: #111; 
      font-weight: bold;
      color: #ffd700;
    }
    .piece {
      width: 0; height: 0;
      border: 13px solid transparent;
      cursor: pointer;
      transition: all .25s ease;
      position: relative;
      z-index: 10;
    }
    .piece:hover { transform: scale(1.35); }
    
    /* NARANJA (Jugador 1) */
    .p1 { border-bottom-color: #ff8c00; }
    .p1.dir-right  { border-left-color: #ff8c00; }
    .p1.dir-left   { border-right-color: #ff8c00; }

    /* AZUL (IA) */
    .p2 { border-top-color: #1e90ff; }
    .p2.dir-down   { border-top-color: #1e90ff; }
    .p2.dir-up     { border-bottom-color: #1e90ff; }

    .completed { 
      opacity: .3; 
      filter: grayscale(1); 
      transform: scale(0.9);
    }

    .steps {
      font-size: 0.65rem;
      margin-top: 2px;
      color: #ffd700;
      font-weight: bold;
    }

    .controls { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    button {
      padding: .9rem 1.8rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    #reset { background: #ffd700; color: #000; }
    #undo  { background: #444; color: #fff; }
    #undo:disabled { background: #222; cursor: not-allowed; }

    #status {
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      min-height: 2.5rem;
      padding: 0.5rem;
    }

    /* MENSAJE DE VICTORIA */
    .winner {
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 12px;
      animation: pulse 1.5s infinite;
    }
    .winner.p1 { background: #ff8c00; color: #000; }
    .winner.p2 { background: #1e90ff; color: #fff; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="status">Turno del Jugador 1 (Naranja)</div>
<div id="winner-message"></div>
<div id="board"></div>

<div class="controls">
  <button id="reset">Jugar de nuevo</button>
  <button id="undo" disabled>Deshacer</button>
</div>

<script>
/* ====================== REGLAS OFICIALES ====================== */
const STEPS_OUT = [1, 1, 2, 2, 3];
const STEPS_BACK = [3, 3, 2, 2, 1];
const CENTRAL_START = 6, CENTRAL_END = 10;
const WIN_CONDITION = 4;

/* ====================== ESTADO ====================== */
let state = {
  p1: Array.from({length:5}, (_,i) => ({lane:i+1, pos:0, dir:1, turned:false, done:false, horizontal:true})),
  p2: Array.from({length:5}, (_,i) => ({lane:i+1, pos:0, dir:1, turned:false, done:false, horizontal:false})),
  turn: 1,
  p1Done: 0,
  p2Done: 0
};
const history = [];

/* ====================== CREAR TABLERO ====================== */
function createBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 7; c++) {
      const div = document.createElement('div');
      const isTrough = (r === 0 || r === 6) || (c === 0 || c === 6);
      div.className = isTrough ? 'trough' : 'slot';

      if (isTrough) {
        div.dataset.trough = `${r}-${c}`;
        if (r >= 1 && r <= 5 && c === 0) div.dataset.start = `h${r}`;
        if (r >= 1 && r <= 5 && c === 6) div.dataset.end = `h${r}`;
        if (c >= 1 && c <= 5 && r === 0) div.dataset.start = `v${c}`;
        if (c >= 1 && c <= 5 && r === 6) div.dataset.end = `v${c}`;

        if ((r === 0 && c >= 1 && c <= 5) || (c === 0 && r >= 1 && r <= 5)) {
          const lane = r === 0 ? c : r;
          const out = STEPS_OUT[lane-1];
          const back = STEPS_BACK[lane-1];
          const label = document.createElement('div');
          label.className = 'steps';
          label.textContent = `${out} to ${back}`;
          div.appendChild(label);
        }
      } else {
        div.dataset.row = r;
        div.dataset.col = c;
      }
      board.appendChild(div);
    }
  }
}

/* ====================== POSICIÓN → SLOT ====================== */
function getSlot(piece) {
  const {pos, lane, horizontal} = piece;
  let r, c;

  if (horizontal) {
    if (pos === 0) return `[data-start="h${lane}"]`;
    if (pos <= 5) { r = lane; c = pos; }
    else if (pos <= 10) { r = lane; c = pos - 5; }
    else if (pos <= 15) { r = lane; c = pos - 10; }
    else return null;
  } else {
    if (pos === 0) return `[data-start="v${lane}"]`;
    if (pos <= 5) { r = pos; c = lane; }
    else if (pos <= 10) { r = pos - 5; c = lane; }
    else if (pos <= 15) { r = pos - 10; c = lane; }
    else return null;
  }

  return `[data-row="${r}"][data-col="${c}"]`;
}

/* ====================== RENDER ====================== */
function render() {
  document.querySelectorAll('.piece').forEach(p => p.remove());

  [...state.p1, ...state.p2].forEach(p => {
    const sel = getSlot(p);
    if (!sel) return;
    const slot = document.querySelector(sel);
    if (!slot) return;

    const el = document.createElement('div');
    el.id = `piece-${p.horizontal?'h':'v'}-${p.lane}`;
    el.className = `piece ${p.horizontal?'p1':'p2'} ${p.done?'completed':''}`;
    el.dataset.player = p.horizontal ? '1' : '2';
    el.dataset.lane = p.lane;

    if (!p.done) {
      if (p.horizontal) el.classList.add(p.dir > 0 ? 'dir-right' : 'dir-left');
      else el.classList.add(p.dir > 0 ? 'dir-down' : 'dir-up');
    }

    slot.appendChild(el);
  });
}

/* ====================== MOVER ====================== */
function movePiece(piece, myArr, oppArr) {
  if (piece.done) return {myArr, oppArr};

  const steps = piece.dir > 0 ? STEPS_OUT[piece.lane-1] : STEPS_BACK[piece.lane-1];
  let target = piece.pos + piece.dir * steps;
  let captured = null;

  for (let i = 1; i <= steps; i++) {
    const check = piece.pos + piece.dir * i;
    if (check < CENTRAL_START || check > CENTRAL_END) continue;

    const centerCoord = check - 5;
    let opp = null;

    if (piece.horizontal) {
      opp = oppArr.find(o => !o.horizontal && o.lane === centerCoord && o.pos === piece.lane + 5);
    } else {
      opp = oppArr.find(o => o.horizontal && o.lane === centerCoord && o.pos === piece.lane + 5);
    }

    if (opp) {
      captured = opp;
      target = check + piece.dir;
      break;
    }
  }

  let newPos = Math.max(0, Math.min(15, target));
  let newDir = piece.dir;
  let turned = piece.turned;
  let done = piece.done;

  if (piece.dir > 0 && newPos >= 15) {
    newPos = 15;
    newDir = -1;
    turned = true;
  }

  if (piece.dir < 0 && newPos <= 0 && turned) {
    newPos = 0;
    done = true;
  }

  const newPiece = {...piece, pos: newPos, dir: newDir, turned, done};
  const newMy = myArr.map(p => p === piece ? newPiece : p);

  let newOpp = [...oppArr];
  if (captured) {
    const resetPos = captured.dir > 0 ? 0 : 15;
    newOpp = newOpp.map(o => o === captured ? {...o, pos: resetPos, dir: captured.dir > 0 ? 1 : -1, turned: false} : o);
  }

  if (done && !piece.done) {
    if (piece.horizontal) state.p1Done++;
    else state.p2Done++;
  }

  return {myArr: newMy, oppArr: newOpp};
}

/* ====================== IA ====================== */
function aiMove() {
  saveState();
  let best = null, bestScore = -Infinity;
  for (let i = 0; i < state.p2.length; i++) {
    if (state.p2[i].done) continue;
    const {myArr, oppArr} = movePiece(state.p2[i], [...state.p2], [...state.p1]);
    const tempState = {...state, p2: myArr, p1: oppArr, turn: 1};
    const score = minimax(tempState, 4, -Infinity, Infinity, false);
    if (score > bestScore) { bestScore = score; best = i; }
  }
  if (best !== null) {
    const {myArr, oppArr} = movePiece(state.p2[best], state.p2, state.p1);
    state.p2 = myArr; state.p1 = oppArr; state.turn = 1;
    render(); updateStatus(); checkWin();
  }
}

function minimax(s, depth, a, b, max) {
  if (s.p2Done >= WIN_CONDITION) return 10000;
  if (s.p1Done >= WIN_CONDITION) return -10000;
  if (depth === 0) return evaluate(s);

  const pieces = max ? s.p2 : s.p1;
  let best = max ? -Infinity : Infinity;

  for (let p of pieces) {
    if (p.done) continue;
    const oppArr = max ? s.p1 : s.p2;
    const {myArr, oppArr: newOpp} = movePiece(p, [...pieces], [...oppArr]);
    const ns = {
      ...s,
      p1: max ? newOpp : myArr,
      p2: max ? myArr : newOpp,
      p1Done: s.p1Done + (max ? 0 : (myArr.some(x => x.done && !pieces.includes(x)) ? 1 : 0)),
      p2Done: s.p2Done + (max ? (myArr.some(x => x.done && !pieces.includes(x)) ? 1 : 0) : 0)
    };
    const val = minimax(ns, depth-1, a, b, !max);
    best = max ? Math.max(best, val) : Math.min(best, val);
    if (max) a = Math.max(a, best); else b = Math.min(b, best);
    if (b <= a) break;
  }
  return best;
}

function evaluate(s) {
  let score = (s.p2Done - s.p1Done) * 100;
  s.p2.forEach(p => { if (!p.done) score += p.turned ? (16 - p.pos) * 1.5 : p.pos; });
  s.p1.forEach(p => { if (!p.done) score -= p.turned ? (16 - p.pos) * 1.5 : p.pos; });
  return score;
}

/* ====================== UI ====================== */
function saveState() {
  history.push({
    p1: state.p1.map(p => ({...p})),
    p2: state.p2.map(p => ({...p})),
    turn: state.turn,
    p1Done: state.p1Done,
    p2Done: state.p2Done
  });
  document.getElementById('undo').disabled = false;
}

function showWinner(player) {
  const msg = document.getElementById('winner-message');
  msg.innerHTML = `
    <div class="winner ${player}">
      ${player === 'p1' ? 'GANASTE TÚ (NARANJA)' : 'GANÓ LA IA (AZUL)'} 
    </div>
  `;
  document.getElementById('undo').disabled = true;
  document.getElementById('reset').textContent = 'Jugar de nuevo';
}

function updateStatus() {
  const el = document.getElementById('status');
  if (state.p1Done >= WIN_CONDITION) {
    el.textContent = '';
    showWinner('p1');
  } else if (state.p2Done >= WIN_CONDITION) {
    el.textContent = '';
    showWinner('p2');
  } else {
    el.textContent = `Turno: ${state.turn===1?'Tú (Naranja)':'IA (Azul)'} | ${state.p1Done} - ${state.p2Done}`;
    document.getElementById('winner-message').innerHTML = '';
  }
}

function checkWin() {
  if (state.p1Done >= WIN_CONDITION || state.p2Done >= WIN_CONDITION) return;
  if (state.turn === 2) setTimeout(aiMove, 700);
}

// Click
document.getElementById('board').addEventListener('click', e => {
  const piece = e.target.closest('.piece');
  if (!piece || state.turn !== 1 || piece.dataset.player !== '1') return;

  const lane = +piece.dataset.lane;
  const p = state.p1.find(x => x.lane === lane);
  if (p.done) return;

  saveState();
  const {myArr, oppArr} = movePiece(p, state.p1, state.p2);
  state.p1 = myArr; state.p2 = oppArr; state.turn = 2;

  render(); updateStatus(); checkWin();
});

// Deshacer
document.getElementById('undo').addEventListener('click', () => {
  if (history.length === 0) return;
  state = history.pop();
  render(); updateStatus();
  document.getElementById('undo').disabled = history.length === 0;
});

// Reiniciar / Jugar de nuevo
document.getElementById('reset').addEventListener('click', () => {
  history.length = 0;
  state = {
    p1: Array.from({length:5}, (_,i) => ({lane:i+1, pos:0, dir:1, turned:false, done:false, horizontal:true})),
    p2: Array.from({length:5}, (_,i) => ({lane:i+1, pos:0, dir:1, turned:false, done:false, horizontal:false})),
    turn: 1, p1Done: 0, p2Done: 0
  };
  document.getElementById('winner-message').innerHTML = '';
  document.getElementById('reset').textContent = 'Jugar de nuevo';
  render(); updateStatus();
  document.getElementById('undo').disabled = true;
});

/* ====================== INICIO ====================== */
createBoard();
render();
updateStatus();
</script>
</body>
</html>
